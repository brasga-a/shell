name: Normalize project name

on:
  push:
    branches:
      - feat/module-crates

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Replace old project-name references
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          workflow = Path('.github/workflows/normalize-project-name.yml')
          result = subprocess.run(
              ['git', 'grep', '-Il', '-i', 'luna', '--', '.'],
              check=False,
              capture_output=True,
              text=True,
          )

          for raw_path in result.stdout.splitlines():
              path = Path(raw_path)
              if path == workflow:
                  continue

              text = path.read_text(encoding='utf-8')

              def replacement(match: re.Match[str]) -> str:
                  value = match.group(0)
                  if value.isupper():
                      return 'SHELL'
                  if value[:1].isupper():
                      return 'Shell'
                  return 'shell'

              updated = re.sub(r'luna', replacement, text, flags=re.IGNORECASE)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Audit remaining references
        shell: bash
        run: |
          remaining="$(git grep -In -i 'luna' -- . ':(exclude).github/workflows/normalize-project-name.yml' || true)"
          if [ -n "$remaining" ]; then
            printf '%s\n' "$remaining"
            exit 1
          fi

          paths="$(git ls-files | grep -i 'luna' || true)"
          if [ -n "$paths" ]; then
            printf 'Tracked paths still contain the old name:\n%s\n' "$paths"
            exit 1
          fi

      - name: Commit normalized references
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No project-name references required changes.'
            exit 0
          fi
          git commit -m 'refactor: replace luna references with shell'
          git push origin HEAD:"${GITHUB_REF_NAME}"
